name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe des scripts
        run: |
          for f in js/*.js sw.js api/yahoo.js; do node --check "$f"; done
          node --input-type=module --check < proxy/cloudflare-worker.js
      - name: Version du cache du service worker à jour
        run: node scripts/sw-version.mjs --check
      - name: Tests unitaires
        run: node --test tests/*.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright et Chart.js ne sont pas des dépendances du site : installés seulement pour ce test (sans modifier package.json).
      # Chart.js remplace la copie du CDN, bloqué pendant les tests, pour vérifier le rendu réel des graphiques.
      - name: Installation de Playwright et Chromium
        run: |
          npm install --no-save playwright@1.63.0 chart.js@4.4.1
          npx playwright install --with-deps chromium
      - name: Tests de bout en bout (relais simulé, aucun appel réseau)
        run: npm run test:e2e
